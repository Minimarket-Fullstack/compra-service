spring.application.name=compra-service
server.port=${PORT:8088}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_minimarket?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

proveedor.service.url=${PROVEEDOR_SERVICE_URL:http://localhost:8085}
producto.service.url=${PRODUCTO_SERVICE_URL:http://localhost:8180}

logging.level.com.minimarket=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%level] %logger{20}: %msg%n
logging.file.name=logs/compra-service.log

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info


# Railway: permite desactivar Eureka si usas URLs directas
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
